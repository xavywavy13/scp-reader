<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1114" media="(prefers-color-scheme: dark)">
<meta name="description" content="A clean, phone-first reader for the SCP Wiki.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>SCP Field Reader</title>
<meta name="apple-mobile-web-app-title" content="SCP Reader">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{color-scheme:light}
/* Layout: one-screen app — tab views scroll inside <main>, a fixed bottom tab bar,
   and a full-screen reader sheet that slides over everything. */
:root{
  --bg:#eceef1; --surface:#ffffff; --raise:#f6f7f9; --ink:#15181c; --muted:#5b636d; --faint:#8a929c;
  --line:#d6dae0; --accent:#9b1c2e; --accent-ink:#ffffff; --accent-soft:#f3e3e5;
  --c-safe:#2f7d4f; --c-euclid:#b07a12; --c-keter:#b3261e; --c-thaumiel:#4b3a8f; --c-apollyon:#5c0f1a;
  --c-neutral:#6a737d; --c-explained:#1f7a80; --c-esoteric:#2c5aa0;
  --f-display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --f-ui:"Atkinson Hyperlegible",-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
  --tabbar-h:58px;
  /* reader paper (follows app theme in Auto) */
  --r-bg:#fbfbf9; --r-ink:#1b1d20; --r-muted:#5f666f; --r-line:#dfe2e6; --r-accent:#9b1c2e; --r-soft:#f1f2f4;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1114; --surface:#161a1f; --raise:#1c2127; --ink:#e5e8eb; --muted:#9aa3ad; --faint:#6c757f;
  --line:#272d34; --accent:#e2576b; --accent-ink:#1a0a0d; --accent-soft:#3a1c22;
  --c-safe:#5cc287; --c-euclid:#e0aa3e; --c-keter:#f06a5f; --c-thaumiel:#a493f0; --c-apollyon:#ff7d8e;
  --c-neutral:#9aa3ad; --c-explained:#4cc3c9; --c-esoteric:#7aa7f0;
  --r-bg:#121518; --r-ink:#d8dce0; --r-muted:#8f98a2; --r-line:#2a3037; --r-accent:#ea7080; --r-soft:#1b1f24;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1114; --surface:#161a1f; --raise:#1c2127; --ink:#e5e8eb; --muted:#9aa3ad; --faint:#6c757f;
  --line:#272d34; --accent:#e2576b; --accent-ink:#1a0a0d; --accent-soft:#3a1c22;
  --c-safe:#5cc287; --c-euclid:#e0aa3e; --c-keter:#f06a5f; --c-thaumiel:#a493f0; --c-apollyon:#ff7d8e;
  --c-neutral:#9aa3ad; --c-explained:#4cc3c9; --c-esoteric:#7aa7f0;
  --r-bg:#121518; --r-ink:#d8dce0; --r-muted:#8f98a2; --r-line:#2a3037; --r-accent:#ea7080; --r-soft:#1b1f24;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}

html,body{height:100%}
html.not-ios{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:inherit}
.app{height:var(--full,100%);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}
.view{max-width:760px;margin:0 auto}

/* tab bar */
.tabs{position:relative;flex:0 0 auto;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
.tabs button{height:var(--tabbar-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;letter-spacing:.04em;color:var(--faint)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent)}

/* headers */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.wordmark{font:700 30px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;margin:0}
.wordmark small{display:block;font:500 11px/1.4 var(--f-mono);letter-spacing:.14em;color:var(--muted);margin-bottom:4px}
h2.sec{font:600 13px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:28px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2.sec button{font:500 13px var(--f-ui);letter-spacing:0;text-transform:none;color:var(--accent)}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--ink)}
.iconbtn svg{width:22px;height:22px}
.iconbtn:active{background:var(--raise)}

/* home */
.resume{display:grid;gap:6px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:left}
.resume .lbl{font:500 11px var(--f-mono);letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
.resume .t{font:600 24px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.resume .n{color:var(--muted);font-size:15px}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.quick button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700}
.quick button svg{width:22px;height:22px;color:var(--accent)}
.quick button:active{transform:scale(.97)}
/* surprise me */
.sf{display:grid;gap:4px}
.sf .schips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:0 18px 2px}
.sf .schips::-webkit-scrollbar{display:none}
.sf .seg button{font-size:13px;padding:8px 4px}
.sf .tog{margin:10px 0 0;justify-content:flex-start;color:var(--ink)}
.sfgo{display:grid;gap:2px;justify-items:center;width:100%;margin-top:16px;padding:14px;border-radius:14px;background:var(--accent);color:var(--accent-ink)}
.sfgo b{font:700 24px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.sfgo span{font:500 12px var(--f-mono);opacity:.85}
.sfgo:disabled{opacity:.45}
.again{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;background:var(--r-accent);color:var(--r-bg);font-weight:700}
.again svg{width:18px;height:18px}
/* offline */
.offl{min-height:44px}
.offl .ob{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.offl .ob svg{width:20px;height:20px;flex:0 0 auto;color:var(--accent)}
.offl .ob b{display:block;font-weight:700}
.offl .ob small{display:block;font:400 12px var(--f-mono);color:var(--muted);margin-top:1px}
.offl .ob .act{margin-left:auto;font:700 13px var(--f-ui);color:var(--accent);flex:0 0 auto}
.offl .ob.saved svg{color:var(--c-safe)}
.offl .ob.saved .act + .act{margin-left:14px}
.offl .bar{margin-top:6px}
.offlist{display:grid;gap:8px}
.daily{margin-top:12px;display:block;width:100%;text-align:left;padding:18px 16px;border-radius:16px;background:var(--ink);color:var(--bg);position:relative;overflow:hidden}
.daily .lbl{font:500 11px var(--f-mono);letter-spacing:.14em;opacity:.7;text-transform:uppercase}
.daily .t{font:700 34px/1 var(--f-display);text-transform:uppercase;margin-top:8px}
.daily .n{font:400 17px/1.3 var(--f-read);font-style:italic;margin-top:4px;opacity:.9}
.daily .m{font:500 12px var(--f-mono);opacity:.7;margin-top:10px}
.daily::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border:14px solid currentColor;border-radius:50%;opacity:.07}
.series{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ser{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:grid;gap:2px;min-width:0}
.ser b{font:700 22px/1 var(--f-display);text-transform:uppercase}
.ser span{font:400 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.ser .bar{margin-top:8px}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px)) 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.card{flex:0 0 200px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:130px}
.card .id{font:700 20px/1 var(--f-display);text-transform:uppercase}
.card .n{font:400 15px/1.3 var(--f-read);color:var(--ink);flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .m{display:flex;gap:6px;align-items:center;font:500 12px var(--f-mono);color:var(--muted)}
.stat{font:400 13px var(--f-mono);color:var(--muted);margin-top:28px;text-align:center;line-height:1.7}
.chipline{display:flex;flex-wrap:wrap;gap:8px}
.hub{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;display:flex;gap:8px;align-items:center}
.hub span{font:500 12px var(--f-mono);color:var(--muted)}
.hub svg{width:14px;height:14px;color:var(--accent)}

/* canons */
.ccard{flex:0 0 250px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.ccard.wide{flex:none;width:100%}
.ccard:active{transform:scale(.985)}
.ccard .k{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.ccard .t{font:700 24px/1 var(--f-display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.ccard .d{font:400 15px/1.4 var(--f-read);color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-height:4.2em}
.ccard .m{font:400 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;margin-top:auto;padding-top:4px}
.ccard .bar{margin-top:0}
.clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.chero{padding:10px 0 6px;display:grid;gap:10px}
.chero .ck{font:500 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.chero .ck span{color:var(--muted)}
.chero .ct{font:700 clamp(38px,11vw,60px)/.92 var(--f-display);text-transform:uppercase;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.chero .cd{font:400 18px/1.5 var(--f-read);margin:0;max-width:36em}
.cq{margin:4px 0;padding:2px 0 2px 14px;border-left:3px solid var(--accent);font:italic 400 16px/1.55 var(--f-read);color:var(--muted);max-width:36em}
.cq p{margin:0;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.cq footer{font:normal 500 12px var(--f-mono);margin-top:8px;color:var(--faint)}
.cq footer button{color:var(--accent);text-decoration:underline;text-underline-offset:3px;font:inherit}
.chero .cs{font:400 13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.cgo{display:grid;gap:2px;text-align:left;padding:14px 16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);margin-top:4px}
.cgo small{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.cgo b{font:700 22px/1.05 var(--f-display);text-transform:uppercase}
.cgo span{font:italic 400 15px/1.3 var(--f-read);opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cgo:active{transform:scale(.985)}
.csec{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font:600 12px/1.3 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:24px 0 6px}
.csec span:last-child{font-variant-numeric:tabular-nums;color:var(--faint);flex:0 0 auto}
.row.num{grid-template-columns:2.1em 1fr auto}
.row .no{font:500 12px var(--f-mono);color:var(--faint);font-variant-numeric:tabular-nums;align-self:start;padding-top:3px}
.cwiki{margin:28px 0 0;text-align:center}
.cwiki a{display:inline-flex;gap:8px;align-items:center;color:var(--accent);font-size:14px;font-weight:700;text-decoration:none}
.cwiki svg{width:16px;height:16px}

/* class chip */
.cls{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--cc,var(--c-neutral));white-space:nowrap}
.cls::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor;transform:rotate(45deg)}
.cls[data-c="safe"]{--cc:var(--c-safe)} .cls[data-c="euclid"]{--cc:var(--c-euclid)} .cls[data-c="keter"]{--cc:var(--c-keter)}
.cls[data-c="thaumiel"]{--cc:var(--c-thaumiel)} .cls[data-c="apollyon"],.cls[data-c="archon"]{--cc:var(--c-apollyon)}
.cls[data-c="explained"]{--cc:var(--c-explained)} .cls[data-c="esoteric-class"],.cls[data-c="ticonderoga"],.cls[data-c="cernunnos"],.cls[data-c="hiemal"],.cls[data-c="tiamat"]{--cc:var(--c-esoteric)}

/* lists */
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:13px 2px;border-bottom:1px solid var(--line);text-align:left;align-items:center;min-width:0}
.row:active{background:var(--raise)}
.row .l{min-width:0;display:grid;gap:3px}
.row .id{font:700 18px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.01em;display:flex;gap:8px;align-items:center}
.row .n{font:400 15px/1.3 var(--f-read);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{display:flex;gap:10px;align-items:center;font:400 12px var(--f-mono);color:var(--muted);flex-wrap:wrap}
.row .st{display:flex;align-items:center;gap:6px;color:var(--faint)}
.row.read .id,.row.read .n{color:var(--muted)}
.ring{width:22px;height:22px}
.done{color:var(--c-safe)}
.bmk{color:var(--accent)}
.more{padding:20px;text-align:center;color:var(--muted);font:400 13px var(--f-mono)}
.empty{padding:40px 12px;text-align:center;color:var(--muted)}
.empty b{display:block;font:700 22px var(--f-display);text-transform:uppercase;color:var(--ink);margin-bottom:6px}

/* filters */
.seg{display:flex;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:0 max(16px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.x{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:700}
.ctl{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.ctl select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin-left:auto}
.tog input{width:18px;height:18px;accent-color:var(--accent)}
.count{font:400 12px var(--f-mono);color:var(--muted);margin:14px 0 6px}

/* search */
.sbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;flex:1}
.sbox svg{width:20px;height:20px;color:var(--faint);flex:0 0 auto}
.sbox input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:17px;color:var(--ink);padding:12px 0;outline:none}
.tips{color:var(--muted);font-size:14px;line-height:1.6;margin-top:18px}
.tips code{font:500 13px var(--f-mono);background:var(--raise);border:1px solid var(--line);padding:1px 6px;border-radius:6px;color:var(--ink)}

/* sheets + overlays */
.overlay{position:fixed;top:0;left:0;right:0;bottom:auto;height:var(--full,100%);z-index:40;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.overlay.open{transform:none}
.ohead{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 6px) max(8px,env(safe-area-inset-right,0px)) 6px max(8px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.ohead h3{flex:1;min-width:0;margin:0;font:700 20px/1.1 var(--f-display);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obody{flex:1;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(env(safe-area-inset-bottom,0px) + 32px)}
.scrim{position:fixed;top:0;left:0;right:0;height:var(--full,100%);z-index:60;background:rgb(0 0 0 / .35);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;top:var(--full,100vh);bottom:auto;z-index:61;background:var(--surface);border-radius:20px 20px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(18px,env(safe-area-inset-left,0px));transform:translateY(4%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-height:calc(var(--full,100vh) * .82);overflow-y:auto;max-width:640px;margin:0 auto}
.sheet.open{transform:translateY(-100%)}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h4{margin:18px 0 8px;font:600 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sheet h4:first-of-type{margin-top:0}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sw{border-radius:12px;border:2px solid var(--line);padding:10px 4px 8px;display:grid;gap:4px;justify-items:center;font-size:12px}

<script>

/* ---------------- storage (local cache + per-person db sync) ---------------- */
const LS = {
  get(k, d){ try { const v = localStorage.getItem("scpr:"+k); return v ? JSON.parse(v) : d; } catch { return d; } },

const DEF_SET = {rt:"auto", font:"serif", size:19, lh:1.62, width:"normal", just:0, hideRead:0, links:"preview"};
const state = {
  lib: Object.assign({bm:{}, read:{}}, LS.get("lib", {})),
  prog: LS.get("prog", {}),         // id -> [fraction, ts]

  set: Object.assign({}, DEF_SET, LS.get("set", {})),
};
const today = () => Math.floor(Date.now()/1000);
let db = null, uid = null;
const dirty = new Set(); let syncT = null; const writing = {};
function save(which){
  if (which === "lib") LS.set("lib", state.lib);
  if (which === "prog") { LS.set("prog", state.prog); LS.set("hist", state.hist); }
  if (which === "set") LS.set("set", state.set);
  dirty.add(which); clearTimeout(syncT); syncT = setTimeout(flushSync, 1800);
}
function docBody(which){
  if (which === "lib") return {bm: state.lib.bm, read: state.lib.read};
  if (which === "prog") return {prog: state.prog, hist: state.hist};
  return {set: state.set};
}
async function flushSync(){
  if (!db || !uid) return;
  for (const w of [...dirty]) {
    if (writing[w]) continue;
    dirty.delete(w); writing[w] = true;
    try { await db.doc(`data/users/${uid}/${w}`).set(docBody(w)); }
    catch (e) { if (e && e.code === "unavailable") dirty.add(w); }
    writing[w] = false;
  }
  if (dirty.size) { clearTimeout(syncT); syncT = setTimeout(flushSync, 4000); }
}
function trimProg(){
  const ents = Object.entries(state.prog).sort((a,b)=>b[1][1]-a[1][1]);
  if (ents.length > 600) state.prog = Object.fromEntries(ents.slice(0, 600));
  state.hist = state.hist.slice(0, 250);
}
async function initSync(){
  try {
    if (!window.claude || !window.claude.use) return;
    const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!d || !u) return;
    const id = await u.id();
    if (!id) return;
    db = d; uid = id;
    const [l, p, s] = await Promise.all(["lib","prog","set"].map(w => db.doc(`data/users/${uid}/${w}`).get().catch(()=>null)));
    let changed = {lib:false, prog:false, set:false};
    const L = l && l.exists ? l.data() : null;
    if (L) {
      for (const k of ["bm","read"]) {
        const remote = L[k] || {};
        for (const [id2, ts] of Object.entries(remote)) if (!(id2 in state.lib[k]) || state.lib[k][id2] < ts) { state.lib[k] = {...state.lib[k], [id2]: ts}; }
        if (Object.keys(state.lib[k]).length !== Object.keys(remote).length) changed.lib = true;
      }
    } else if (Object.keys(state.lib.bm).length || Object.keys(state.lib.read).length) changed.lib = true;
    const P = p && p.exists ? p.data() : null;
    if (P) {
      for (const [id2, v] of Object.entries(P.prog || {})) if (!state.prog[id2] || state.prog[id2][1] < v[1]) state.prog[id2] = v;
      const seen = new Set(); const merged = [...(P.hist||[]), ...state.hist].sort((a,b)=>b[1]-a[1]).filter(([i]) => !seen.has(i) && seen.add(i));
      if (merged.length !== (P.hist||[]).length) changed.prog = true;

    } else if (state.hist.length) changed.prog = true;
    const S = s && s.exists ? s.data() : null;
    if (S && S.set) { state.set = Object.assign({}, DEF_SET, S.set); LS.set("set", state.set); applyReaderSettings(); }
    LS.set("lib", state.lib); LS.set("prog", state.prog); LS.set("hist", state.hist);
    for (const k of Object.keys(changed)) if (changed[k]) dirty.add(k);

}

/* ---------------- data ---------------- */
let IDX = null, ALL = [], BY = new Map(), POS = new Map();
async function fetchGz(url, opts){
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const buf = new Uint8Array(await r.arrayBuffer());
  let text;
  if (buf[0] === 0x1f && buf[1] === 0x8b) {
    const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
    text = await new Response(stream).text();
  } else text = new TextDecoder().decode(buf);
  return JSON.parse(text);
}
const chunkCache = new Map();
// Chunk URLs carry the archive version, so a saved copy from an older archive is never
// matched up with a newer article list.
const chunkUrl = n => `data/c/${String(n).padStart(3,"0")}.gz?v=${encodeURIComponent((IDX.cv && IDX.cv[n]) || IDX.dv || IDX.built || "1")}`;
function getChunk(n, fresh){
  if (fresh) chunkCache.delete(n);
  if (!chunkCache.has(n)) {
    const p = fetchGz(chunkUrl(n) + (fresh ? "&fresh=" + Date.now() : ""), fresh ? {cache: "reload"} : undefined).catch(e => { chunkCache.delete(n); throw e; });
    chunkCache.set(n, p);
    if (chunkCache.size > 8) chunkCache.delete(chunkCache.keys().next().value);
  }
  return chunkCache.get(n);
}
const label = m => m.k === "scp" ? m.t : m.t;
const sub = m => m.k === "scp" ? (m.n || "") : (m.k === "goi" ? "Group of Interest" : "Tale") + (m.a ? " · " + m.a : "");

const isRead = id => id in state.lib.read;
const isBm = id => id in state.lib.bm;
const progOf = id => state.prog[id] ? state.prog[id][0] : 0;

/* ---------------- shell / tabs ---------------- */

function render(soft){
  if (!IDX) return;
  ({home:renderHome, browse:renderBrowse, search:renderSearch, library:renderLibrary})[tab](soft);
}

/* ---------------- rows / lazy lists ---------------- */
function rowHTML(m){
  const p = progOf(m.id), r = isRead(m.id);
  const st = (isBm(m.id) ? `<span class="bmk">${ICON.bm}</span>` : "") + (r ? `<span class="done" aria-label="Read">${ICON.check}</span>` : p > 0.02 ? ring(p) : "");

function lazyList(container, items, emptyHTML){
  container.innerHTML = "";
  if (!items.length) { container.innerHTML = emptyHTML || `<div class="empty"><b>No files found</b>Try loosening the filters.</div>`; return; }
  const rows = document.createElement("div"); rows.className = "rows"; container.appendChild(rows);
  const sentinel = document.createElement("div"); sentinel.className = "more"; container.appendChild(sentinel);

    if (i >= items.length) io.disconnect();

  more(); io.observe(sentinel);

/* ---------------- home ---------------- */
function seriesStats(){
  const st = new Map();

  }
  const order = [...st.keys()].sort((a,b) => {
    const na = /^s\d+$/.test(a) ? +a.slice(1) : 50 + Object.keys(SERIES_NAMES).indexOf(a);
    const nb = /^s\d+$/.test(b) ? +b.slice(1) : 50 + Object.keys(SERIES_NAMES).indexOf(b);
    return na - nb;
  });

}

  const pool = ALL.filter(m => m.k === "scp" && m.r >= 250);

    </div>

    </div>

/* ---------------- search ---------------- */
let lastQ = "";
function search(q){
  q = q.trim().toLowerCase(); if (!q) return [];
  const out = [];
  if (q.startsWith("#")) {
    const tq = q.slice(1); const ti = IDX.tags.indexOf(tq);
    return ti < 0 ? [] : ALL.filter(m => m.g.includes(ti)).sort((a,b)=>b.r-a.r);
  }
  if (q.startsWith("by:")) { const a = q.slice(3).trim(); return ALL.filter(m => (m.a||"").toLowerCase().includes(a)).sort((x,y)=>y.r-x.r); }
  const num = /^(scp-?)?(\d{1,4})(-[a-z]+)?$/.exec(q.replace(/\s+/g,""));
  const words = q.split(/\s+/).filter(Boolean);
  for (const m of ALL) {
    let s = 0;
    if (num && m.k === "scp" && m.no === +num[2]) s = 1000 + ((m.s||"").startsWith("series") ? 50 : 0);
    const hay = m._h || (m._h = (m.t + " " + (m.n||"") + " " + (m.a||"") + " " + m.id).toLowerCase());
    if (!s) {
      if (!words.every(w => hay.includes(w))) continue;
      const nk = (m.n || m.t).toLowerCase();
      s = nk.startsWith(q) ? 300 : nk.includes(q) ? 200 : hay.includes(q) ? 120 : 60;
    }
    out.push([s + Math.min(99, Math.max(0, m.r) / 20), m]);
  }
  return out.sort((a,b) => b[0]-a[0]).slice(0, 300).map(x => x[1]);
}

async function exportBackup(){
  const name = `scp-reader-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const blob = new Blob([JSON.stringify(backupData())], {type: "application/json"});
  const done = () => { LS.set("lastBackup", Date.now()); const m = $("#bkMsg"); if (m) m.textContent = "Backup exported."; };
  try {
    const file = new File([blob], name, {type: "application/json"});
    if (navigator.canShare && navigator.canShare({files: [file]})) {
      await navigator.share({files: [file], title: "SCP Field Reader backup"});
      return done();
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  done();
}
async function importBackup(file){
  const msg = $("#bkMsg");
  let d;
  try { d = JSON.parse(await file.text()); } catch { msg.textContent = "That file isn't a backup from this app. Choose a file ending in .json that you exported here."; return; }
  if (!d || d.app !== "scp-field-reader" || !d.lib) { msg.textContent = "That file isn't a backup from this app. Choose a file you exported with Export backup."; return; }
  const add = {bm: 0, read: 0, prog: 0};
  const lib = {bm: {...state.lib.bm}, read: {...state.lib.read}};
  for (const k of ["bm", "read"]) for (const [id, ts] of Object.entries(d.lib[k] || {})) {
    if (!(id in lib[k])) add[k]++;
    if (!(id in lib[k]) || lib[k][id] < ts) lib[k][id] = ts;
  }
  state.lib = {...state.lib, ...lib};
  for (const [id, v] of Object.entries(d.prog || {})) {
    if (!Array.isArray(v)) continue;
    if (!state.prog[id]) add.prog++;
    if (!state.prog[id] || state.prog[id][1] < v[1]) state.prog[id] = v;
  }
  const seen = new Set();
  state.hist = [...(d.hist || []), ...state.hist].filter(x => Array.isArray(x)).sort((a, b) => b[1] - a[1]).filter(([i]) => !seen.has(i) && seen.add(i));
  trimProg();
  if (d.set && !LS.get("set", null)) { state.set = Object.assign({}, DEF_SET, d.set); save("set"); applyReaderSettings(); }
  save("lib"); save("prog");
  msg.textContent = `Restored: ${fmt(add.bm)} saved files, ${fmt(add.read)} finished files and ${fmt(add.prog)} reading places added.`;
  toast("Backup restored");
  refresh();
}

const DATA_CACHE = "data-v3";   // must match DATA in sw.js
const IMG_CACHE = "img-v1";     // must match IMG in sw.js
const offJobs = new Map();
const chunkHref = n => new URL(chunkUrl(n), location.href).href;
function collection(key){
  const [kind, val] = [key.slice(0, key.indexOf(":")), key.slice(key.indexOf(":") + 1)];
  if (kind === "series") return {label: seriesLabel(val), ids: ALL.filter(m => m.k === "scp" && seriesKey(m.s) === val).map(m => m.id)};
  if (kind === "kind") return {label: val === "tale" ? "All tales" : "All Groups of Interest", ids: ALL.filter(m => m.k === val).map(m => m.id)};
  if (kind === "canon") { const c = CANON_BY.get(val); return c ? {label: c.t, ids: c.all} : {label: "Canon", ids: []}; }
  if (kind === "file") { const m = BY.get(val); return {label: m ? m.t : val, ids: m ? [m.id] : []}; }
  return {label: "Everything", ids: ALL.map(m => m.id)};
}
const chunksOf = ids => [...new Set(ids.map(id => BY.get(id)).filter(Boolean).map(m => m.ch))];
const picsOf = ids => ids.reduce((n, id) => n + ((BY.get(id) || {}).i || 0), 0);

const picMB = n => Math.max(1, Math.round(n * 0.2));

async function cachedCount(chs){
  if (!("caches" in window)) return 0;
  const have = await cacheKeys(DATA_CACHE);
  return chs.filter(n => have.has(chunkHref(n))).length;
}
// picture addresses inside an article's saved text (as the reader shows them)
const unent = s => s.replace(/&amp;/g, "&").replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&lt;/g, "<").replace(/&gt;/g, ">");
async function picUrls(ids){
  const byChunk = new Map();
  for (const id of ids) { const m = BY.get(id); if (m && m.i) { if (!byChunk.has(m.ch)) byChunk.set(m.ch, []); byChunk.get(m.ch).push(id); } }
  const urls = new Set();
  for (const [n, list] of byChunk) {
    let ch; try { ch = await getChunk(n); } catch { continue; }
    for (const id of list) for (const x of (ch[id] || "").matchAll(/class="img" href="([^"]+)"/g)) { const u = unent(x[1]); if (/^https?:\/\//.test(u)) urls.add(u); }
  }

}
async function savePics(urls, job, onTick){
  const cache = await caches.open(IMG_CACHE), have = await cacheKeys(IMG_CACHE);
  const queue = urls.filter(u => !have.has(u));
  if (job) job.pdone += urls.length - queue.length;
  const worker = async () => {
    while (queue.length && !(job && job.stop)) {
      const u = queue.shift();
      try {
        // the wiki's picture server doesn't allow copying, so this is a sealed ("opaque") copy:
        // the app can't look inside it, but it can show it in the reader when offline
        const res = await fetch(u, {mode: "no-cors", referrerPolicy: "no-referrer", credentials: "omit"});
        await cache.put(u, res);
      } catch { if (job) job.pfailed++; }
      if (job) job.pdone++;

    }
  };

}
async function dropPics(urls){
  if (!urls.length) return;
  const cache = await caches.open(IMG_CACHE);

// pictures that something else still needs: other saved collections with pictures, and saved files
async function picsStillNeeded(exceptKey){
  const saved = LS.get("offline", {});
  const ids = new Set(Object.keys(state.lib.bm));

function askDownload(key){

    ${big ? `<p class="note" style="margin-top:6px">That's a lot of pictures. Leave this off unless you have plenty of space.</p>` : ""}
    <div class="confirm"><button class="btn" data-x>Cancel</button><button class="btn pri" id="dlGo">Download</button></div>`, () => {

async function downloadOffline(key, pics){
  if (!("caches" in window)) return toast("This browser can't save files for offline reading");
  if (offJobs.has(key)) return;
  const col = collection(key), chs = chunksOf(col.ids);
  const job = {done: 0, total: chs.length, failed: 0, stop: false, pics, pdone: 0, ptotal: 0, pfailed: 0, phase: "text"};
  offJobs.set(key, job); hydrateOffline(key);
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
  const cache = await caches.open(DATA_CACHE);
  const have = await cacheKeys(DATA_CACHE);
  const queue = [...chs];
  const worker = async () => {
    while (queue.length && !job.stop) {
      const url = chunkHref(queue.shift());
      try {
        if (!have.has(url)) {
          const res = await fetch(url);
          if (!res.ok) throw new Error(res.status);
          if (!navigator.serviceWorker || !navigator.serviceWorker.controller) await cache.put(url, res.clone());
          await res.arrayBuffer();

    }

    let t = 0;
    await savePics(urls, job, () => { if (++t % 3 === 0) hydrateOffline(key); });
  }
  offJobs.delete(key);
  if (!job.stop && !job.failed) {
    const saved = LS.get("offline", {});
    saved[key] = {label: col.label, ts: Date.now(), pics: !!pics || !!(saved[key] && saved[key].pics)};
    LS.set("offline", saved);

}
async function removeOffline(key){
  const was = LS.get("offline", {})[key];

  const keep = new Set(Object.keys(saved).flatMap(k => chunksOf(collection(k).ids)));

  if ("caches" in window) {
    if (was && was.pics) {
      const mine = await picUrls(col.ids), need = await picsStillNeeded(key);
      await dropPics(mine.filter(u => !need.has(u)));

    const drop = new Set(chunksOf(col.ids).filter(n => !keep.has(n)).map(n => `/data/c/${String(n).padStart(3, "0")}.gz`));
    const c = await caches.open(DATA_CACHE);

}

async function hydrateOffline(only){

const KEY_RE = /^(addend(um|a)|appendix|description|special containment|containment procedures|interview|incident|experiment|exploration|test(ing)? log|test \d|document|recovery|discovery|history|update|transcript|log|note|summary|background|supplement|attachment|footnotes?|epilogue|prologue|part\b|chapter)/i;
function outlineItems(){
  const body = RW.querySelector(".rbody"); if (!body) return [];
  const out = [];
  const walker = body.querySelectorAll("h1,h2,h3,h4,h5,h6,p,summary,.tabbar .tab,.acs");
  for (const el of walker) {
    let label = "", sub = false;
    if (/^H[1-6]$/.test(el.tagName)) label = el.textContent;
    else if (el.tagName === "SUMMARY") { label = el.textContent; sub = true; }
    else if (el.classList.contains("tab")) { label = el.textContent; sub = true; }
    else if (el.classList.contains("acs")) label = "Classification";
    else if (el.tagName === "P") {
      const f = el.firstElementChild;
      if (!f || !/^(STRONG|B)$/.test(f.tagName) || el.textContent.trim().indexOf(f.textContent.trim()) !== 0) continue;
      const t = f.textContent.trim();
      if (t.length > 70) continue;
      // a bold label counts if it names a section ("Addendum 4:") or stands alone as a heading;
      // speaker names in transcripts ("Dr. Clef: ...") don't
      if (!KEY_RE.test(t) && !(t.endsWith(":") && el.textContent.trim().length <= t.length + 2)) continue;
      label = t;
      if (/^(item\s*#|object class|containment class|secondary class|disruption class|risk class|clearance|level)/i.test(label)) continue;
    }
    label = label.replace(/\s+/g, " ").replace(/[:\s]+$/, "").trim();
    if (!label || label.length > 90) continue;
    if (out.length && out[out.length - 1].label === label) continue;
    out.push({label, el, sub});
  }
  return out;
}
function revealEl(el){
  // open any collapsed section and switch to the tab that holds the element
  for (let d = el.closest("details"); d; d = d.parentElement && d.parentElement.closest("details")) d.open = true;
  const pane = el.closest(".pane");
  if (pane && pane.hidden) {
    const set = pane.closest(".tabset"), i = pane.dataset.i;
    set.querySelectorAll(":scope > .tabbar .tab").forEach(t => t.classList.toggle("on", t.dataset.i === i));
    set.querySelectorAll(":scope > .pane").forEach(p => p.hidden = p.dataset.i !== i);
  }
}
function scrollToEl(el, center){
  revealEl(el);
  const top = el.getBoundingClientRect().top - RS.getBoundingClientRect().top + RS.scrollTop;
  RS.scrollTop = Math.max(0, center ? top - RS.clientHeight / 2 + 20 : top - 76 - (parseFloat(getComputedStyle(RS).paddingTop) > 90 ? 0 : 0));
}
$("#rOl").onclick = () => {
  const items = outlineItems();
  const max = RS.scrollHeight - RS.clientHeight, f = max > 0 ? RS.scrollTop / max : 0;
  const left = cur ? Math.max(0, Math.round(mins(cur) * (1 - f))) : 0;
  const y = RS.getBoundingClientRect().top + 90;
  let here = -1; items.forEach((it, i) => { const r = it.el.getBoundingClientRect(); if (r.top <= y && (r.width || r.height)) here = i; });
  openSheet(`<div class="olhead"><h4>Outline</h4><span>${Math.round(f * 100)}% · ${left ? `about ${left} min left` : "almost done"}</span></div>
    ${items.length ? `<div class="ol">${items.map((it, i) => `<button data-ol="${i}" class="${it.sub ? "sub" : ""}${i === here ? " here" : ""}"><span class="lv">${i === here ? "You" : String(i + 1).padStart(2, "0")}</span><span>${esc(it.label)}</span></button>`).join("")}</div>`
      : `<p class="note">This file doesn't have sections to jump to.</p>`}
    <div class="confirm"><button class="btn" id="olTop">Back to the top</button><button class="btn" id="olEnd">Jump to the end</button></div>`, () => {
    $("#sheetB").querySelectorAll("[data-ol]").forEach(b => b.onclick = () => { closeSheet(); scrollToEl(items[+b.dataset.ol].el); });
    $("#olTop").onclick = () => { closeSheet(); RS.scrollTop = 0; };
    $("#olEnd").onclick = () => { closeSheet(); const e = RW.querySelector(".rend"); if (e) scrollToEl(e); };
    const h = $("#sheetB").querySelector(".here"); if (h) h.scrollIntoView({block: "center"});
  });
};

/* ---------------- find in article ---------------- */
let hits = [], hitAt = -1, findT = null;
function clearHits(){
  RW.querySelectorAll("mark.hit").forEach(mk => { const t = document.createTextNode(mk.textContent); mk.replaceWith(t); });
  RW.querySelector(".rbody")?.normalize();
  hits = []; hitAt = -1;
}
function runFind(){
  clearHits();
  const q = $("#fq").value.trim();
  const body = RW.querySelector(".rbody");
  if (!body || q.length < 2) { $("#fcount").textContent = ""; return; }
  const ql = q.toLowerCase(), nodes = [];
  const tw = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, {acceptNode: n => n.nodeValue.toLowerCase().includes(ql) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT});
  while (tw.nextNode()) nodes.push(tw.currentNode);
  for (const n of nodes) {
    if (hits.length >= 500) break;
    const text = n.nodeValue, lower = text.toLowerCase(), frag = document.createDocumentFragment();
    let i = 0, j;
    while ((j = lower.indexOf(ql, i)) !== -1 && hits.length < 500) {
      frag.append(text.slice(i, j));
      const mk = document.createElement("mark"); mk.className = "hit"; mk.textContent = text.slice(j, j + q.length);
      frag.append(mk); hits.push(mk); i = j + q.length;
    }
    frag.append(text.slice(i));
    n.replaceWith(frag);
  }
  if (!hits.length) { $("#fcount").textContent = "None"; return; }
  // start at the first match below where you're reading
  const y = RS.getBoundingClientRect().top + 80;
  const k = hits.findIndex(mk => { revealEl(mk); return mk.getBoundingClientRect().top >= y; });
  goHit(k < 0 ? 0 : k);
}
function goHit(i){
  if (!hits.length) return;
  hitAt = (i + hits.length) % hits.length;
  hits.forEach((mk, x) => mk.classList.toggle("cur", x === hitAt));
  scrollToEl(hits[hitAt], true);
  $("#fcount").textContent = `${hitAt + 1}/${hits.length}${hits.length >= 500 ? "+" : ""}`;
}
function openFind(){
  if (!RW.querySelector(".rbody")) return;
  $("#findbar").hidden = false; R.classList.remove("hidebar");
  const q = $("#fq"); q.focus(); q.select();
}
function closeFind(keepText){
  if (!$("#findbar")) return;
  $("#findbar").hidden = true; clearHits();
  if (!keepText) $("#fcount").textContent = "";
  $("#fq").blur();
}
$("#rFind").onclick = openFind;
$("#fq").addEventListener("input", () => { clearTimeout(findT); findT = setTimeout(runFind, 220); });
$("#fq").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); if (hits.length) goHit(hitAt + (e.shiftKey ? -1 : 1)); else runFind(); $("#fq").blur(); } if (e.key === "Escape") closeFind(); });
$("#fnext").onclick = () => goHit(hitAt + 1);
$("#fprev").onclick = () => goHit(hitAt - 1);
$("#fdone").onclick = () => closeFind();

/* ---------------- swipe between articles ---------------- */
function swipeTargets(m){
  const c = curCanon && CANON_BY.get(curCanon);
  if (c && c.all.includes(m.id)) {
    const i = c.all.indexOf(m.id);
    return [c.all[i - 1] ? BY.get(c.all[i - 1]) : null, c.all[i + 1] ? BY.get(c.all[i + 1]) : null, c.t];
  }
  const [p, n] = neighbors(m);
  return [p, n, m.k === "scp" ? seriesLabel(seriesKey(m.s)) : m.k === "goi" ? "Groups of Interest" : "Tales"];
}
(() => {
  let sx = 0, sy = 0, dx = 0, mode = null, tg = null;
  const L = $("#swL"), Rr = $("#swR");
  const scrollsSideways = el => { for (; el && el !== RS; el = el.parentElement) if (el.scrollWidth > el.clientWidth + 2 && /(auto|scroll)/.test(getComputedStyle(el).overflowX)) return true; return false; };
  const reset = (anim) => {
    RW.style.transition = anim ? "transform .2s ease" : ""; RW.style.transform = "";
    L.classList.remove("on"); Rr.classList.remove("on");
    if (anim) setTimeout(() => { RW.style.transition = ""; }, 220);
  };
  RS.addEventListener("touchstart", e => {
    mode = null; dx = 0;
    if (e.touches.length !== 1 || !cur || !RW.querySelector(".rbody") || !$("#findbar").hidden) { mode = "off"; return; }
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY;
    if (sx < 24 || sx > innerWidth - 24 || scrollsSideways(e.target)) { mode = "off"; return; }
    tg = swipeTargets(cur);
  }, {passive: true});
  RS.addEventListener("touchmove", e => {
    if (mode === "off" || e.touches.length !== 1) return;
    const t = e.touches[0], x = t.clientX - sx, y = t.clientY - sy;
    if (!mode) {
      if (Math.abs(x) < 12 && Math.abs(y) < 12) return;
      mode = Math.abs(x) > Math.abs(y) * 1.6 ? "x" : "off";
      if (mode !== "x") return;
    }
    if (e.cancelable) e.preventDefault();
    dx = x;
    const target = dx < 0 ? tg[1] : tg[0];
    const pull = target ? dx * 0.55 : dx * 0.18;
    RW.style.transform = `translateX(${pull}px)`;
    const hint = dx < 0 ? Rr : L, other = dx < 0 ? L : Rr;
    other.classList.remove("on");
    hint.innerHTML = target ? `${dx < 0 ? "Next" : "Previous"} in ${esc(tg[2])}<b>${esc(target.t)}</b>` : `No ${dx < 0 ? "next" : "previous"} file`;
    hint.classList.toggle("on", Math.abs(dx) > 40);
  }, {passive: false});
  RS.addEventListener("touchend", () => {
    if (mode !== "x") { mode = null; return; }
    mode = null;
    const target = dx < 0 ? tg[1] : tg[0];
    if (target && Math.abs(dx) > 90) {
      RW.style.transition = "transform .18s ease-in"; RW.style.transform = `translateX(${dx < 0 ? -110 : 110}%)`;
      L.classList.remove("on"); Rr.classList.remove("on");
      persistProgress();
      setTimeout(() => { RW.style.transition = ""; RW.style.transform = ""; openArticle(target.id, {replace: true, canon: curCanon, top: false}); }, 170);
    } else reset(true);
  });
  RS.addEventListener("touchcancel", () => { mode = null; reset(true); });
})();

/* link preview: tap an SCP link to see what it is before leaving the page */
let pvId = null;
function summaryOf(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const ps = [...doc.querySelectorAll("p")].map(p => p.textContent.replace(/\s+/g, " ").trim()).filter(Boolean);
  let t = ps.find(x => /^description\s*:/i.test(x));
  if (t) t = t.replace(/^description\s*:\s*/i, "");
  else t = ps.find(x => x.length > 80 && !/^(item\s*#|object class|special containment|containment class|by\s)/i.test(x)) || ps[0] || "";
  return t.length > 230 ? t.slice(0, 230).replace(/\s+\S*$/, "") + "…" : t;
}
function previewLink(id){
  const m = BY.get(id); if (!m) return;
  pvId = id;
  const kind = m.k === "scp" ? seriesLabel(seriesKey(m.s)) : (m.k === "goi" ? "Group of Interest" : "Tale");
  const p = progOf(id);
  openSheet(`<div class="pv">
      <div class="k"><span>${esc(kind)}</span>${m.c ? `<span class="cls" data-c="${esc(m.c)}">${esc(CLASS_LABEL(m.c))}</span>` : ""}</div>
      <div class="t">${esc(m.t)}</div>
      ${m.k === "scp" && m.n ? `<div class="n">${esc(m.n)}</div>` : m.a ? `<div class="n">by ${esc(m.a)}</div>` : ""}
      <div class="m"><span>+${fmt(m.r)}</span><span>${mins(m)} min</span>${isRead(id) ? `<span class="done">${ICON.check}Read</span>` : p > 0.02 ? `<span>${Math.round(p * 100)}% read</span>` : ""}</div>
      <p class="sn wait" id="pvSn">Loading a summary…</p>
      <div class="confirm"><button class="btn" id="pvSave">${isBm(id) ? "Saved" : "Save for later"}</button><button class="btn pri" id="pvOpen">Open</button></div>
    </div>`, () => {
    $("#pvOpen").onclick = () => { closeSheet(); openArticle(id); };
    $("#pvSave").onclick = () => {
      const bm = {...state.lib.bm};
      if (bm[id]) delete bm[id]; else bm[id] = today();
      state.lib = {...state.lib, bm}; save("lib");
      $("#pvSave").textContent = bm[id] ? "Saved" : "Save for later";
      toast(bm[id] ? "Saved to Library · kept offline" : "Removed from Saved");
      if (bm[id]) keepFileOffline(id); else releaseFileOffline(id);
    };
  });
  getChunk(m.ch).then(ch => {
    if (pvId !== id || !$("#pvSn")) return;
    const s = ch[id] ? summaryOf(ch[id]) : "";
    const el = $("#pvSn"); el.classList.remove("wait");
    el.textContent = s || "No summary for this one. Open it to read the file.";
  }).catch(() => { const el = $("#pvSn"); if (el && pvId === id) el.textContent = "Couldn't load a summary. You can still open the file."; });
}

/* reading settings sheet */
$("#rAa").onclick = () => {
  const s = state.set;
  const sw = [["auto","Auto","linear-gradient(135deg,#fbfbf9 50%,#121518 50%)","#888"],["paper","Paper","#fbfbf9","#1b1d20"],["sepia","Sepia","#f2e8d5","#3a2e20"],["night","Night","#121518","#d8dce0"],["crt","Amber","#0c0905","#ffb648"]];
  openSheet(`
    <h4>Page</h4><div class="swatches">${sw.map(([k,l,bg,fg]) => `<button class="sw" data-rt="${k}" aria-pressed="${s.rt===k}"><i style="background:${bg};color:${fg};width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line)">Aa</i>${l}</button>`).join("")}</div>
    <h4>Typeface</h4><div class="seg">${[["serif","Literata","var(--f-read)"],["sans","Hyperlegible","var(--f-ui)"],["mono","Plex Mono","var(--f-mono)"]].map(([k,l,f]) => `<button data-font="${k}" aria-pressed="${s.font===k}" style="font-family:${f}">${l}</button>`).join("")}</div>
    <h4>Text size</h4><div class="stepper"><button data-sz="-1" aria-label="Smaller">A−</button><output id="szo">${s.size}px</output><button data-sz="1" aria-label="Larger">A+</button></div>
    <h4>Line spacing</h4><div class="seg">${[[1.45,"Tight"],[1.62,"Normal"],[1.85,"Airy"]].map(([v,l]) => `<button data-lh="${v}" aria-pressed="${s.lh==v}">${l}</button>`).join("")}</div>
    <h4>Margins</h4><div class="seg">${[["narrow","Wide margins"],["normal","Normal"],["wide","Full width"]].map(([v,l]) => `<button data-wd="${v}" aria-pressed="${s.width===v}">${l}</button>`).join("")}</div>
    <h4>Alignment</h4><div class="seg"><button data-j="0" aria-pressed="${!s.just}">Ragged</button><button data-j="1" aria-pressed="${!!s.just}">Justified</button></div>

    B2.querySelectorAll("[data-rt]").forEach(b => b.onclick = () => { set("rt", b.dataset.rt); press("[data-rt]", b); });
    B2.querySelectorAll("[data-font]").forEach(b => b.onclick = () => { set("font", b.dataset.font); press("[data-font]", b); });
    B2.querySelectorAll("[data-lh]").forEach(b => b.onclick = () => { set("lh", +b.dataset.lh); press("[data-lh]", b); });
    B2.querySelectorAll("[data-wd]").forEach(b => b.onclick = () => { set("width", b.dataset.wd); press("[data-wd]", b); });
    B2.querySelectorAll("[data-j]").forEach(b => b.onclick = () => { set("just", +b.dataset.j); press("[data-j]", b); });
    B2.querySelectorAll("[data-ln]").forEach(b => b.onclick = () => { set("links", b.dataset.ln); press("[data-ln]", b); });
    B2.querySelectorAll("[data-sz]").forEach(b => b.onclick = () => {
      const f = RS.scrollTop / Math.max(1, RS.scrollHeight - RS.clientHeight);
      set("size", Math.max(14, Math.min(28, state.set.size + +b.dataset.sz))); $("#szo").textContent = state.set.size + "px";
      RS.scrollTop = f * (RS.scrollHeight - RS.clientHeight);

/* ---------------- boot ---------------- */
async function boot(){
  const bar = $("#bootBar"), s = $("#bootS");
  let pct = 8; const tick = setInterval(() => { pct = Math.min(88, pct + (90 - pct) * 0.08); bar.style.width = pct + "%"; }, 120);
  try {
    IDX = await fetchGz("data/index.gz");
  } catch (e) {
    clearInterval(tick); s.textContent = "Couldn't open the archive. Check your connection and reload."; return;
  }
  ALL = IDX.a; ALL.forEach((m, i) => { BY.set(m.id, m); POS.set(m.id, i); });
  clearInterval(tick); bar.style.width = "100%";
  try { const t = sessionStorage.getItem("scpr:tab"); if (t && t !== "home") { tab = t; document.querySelectorAll(".tabs button").forEach(x => x.toggleAttribute("aria-current", x.dataset.tab === t)); document.querySelector(`.tabs button[data-tab="${t}"]`).setAttribute("aria-current","page"); } } catch {}
  render(); fitScreen();
  loadCanons();
  loadLinks();
  loadExtras();
  if (!LS.get("bmPics", 0) && "caches" in window) setTimeout(async () => {
    for (const id of Object.keys(state.lib.bm)) await keepFileOffline(id);
    LS.set("bmPics", 1);
  }, 8000);
  $("#boot").style.transition = "opacity .3s"; $("#boot").style.opacity = "0"; setTimeout(() => $("#boot").remove(), 320);
  const h = decodeURIComponent((location.hash || "").slice(1)).toLowerCase();
  if (h && BY.has(h)) openArticle(h);
}
$("#lbClose").onclick = () => $("#lb").classList.remove("open");
$("#lb").addEventListener("click", e => { if (e.target.id === "lb" || e.target.classList.contains("lbimg")) $("#lb").classList.remove("open"); });
/* iPhone home-screen apps can report a viewport shorter than the screen by the
   status-bar height; measure the real screen and stretch the layout to it. */
let vgap = 0;
function fitScreen(){
  // Only iPhone/iPad home-screen apps have this bug. Android reports its own status and
  // navigation bars in screen.height, so it must not be stretched.
  const st = IS_IOS && (navigator.standalone === true || matchMedia("(display-mode: standalone)").matches);
  const portrait = innerHeight >= innerWidth;
  const full = portrait ? Math.max(screen.height, screen.width) : Math.min(screen.height, screen.width);
  const gap = full - innerHeight;
  vgap = st && gap > 0 && gap < 120 ? gap : 0;
  const rs = document.documentElement.style;
  rs.setProperty("--vgap", vgap + "px");
  rs.setProperty("--full", (innerHeight + vgap) + "px");
}
addEventListener("resize", fitScreen);
// Android: the page itself never scrolls; only the panels inside it do
if (!IS_IOS) addEventListener("scroll", () => { if (scrollY || scrollX) scrollTo(0, 0); }, {passive:true}); addEventListener("orientationchange", () => setTimeout(fitScreen, 300));
fitScreen();
applyReaderSettings();
boot();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
})();
