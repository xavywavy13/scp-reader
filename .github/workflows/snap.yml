name: Screenshot wiki pages (temporary)
on: workflow_dispatch
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Screenshots
        run: |
          mkdir -p shots
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          pages = ["project-paragon-hub", "antimemetics-division-hub", "resurrection-hub", "third-law-hub"]
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  pg = await b.new_page(viewport={"width": 430, "height": 900}, device_scale_factor=1.5)
                  for s in pages:
                      await pg.goto(f"https://scp-wiki.wikidot.com/{s}", wait_until="load", timeout=90000)
                      await pg.wait_for_timeout(6000)
                      await pg.screenshot(path=f"shots/{s}.png", full_page=True)
                      open(f"shots/{s}.html", "w").write(await pg.content())
                  await b.close()
          asyncio.run(main())
          PY
      - name: Hand the screenshots over on a temporary branch
        if: always()
        run: |
          cd shots
          git init -q -b tmp-snaps
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "screenshots"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tmp-snaps
permissions:
  contents: write
