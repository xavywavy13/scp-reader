name: Probe wiki (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -o /tmp/cs.html "https://scp-wiki.wikidot.com/scp-173/comments/show"
          echo "== markers"; for k in post-container thread-container 'class="post' 'id="post-' 'page-comments' 'comments-container' 'action-area'; do echo "$k: $(grep -c "$k" /tmp/cs.html)"; done
          echo "== around thread"; grep -o '.\{200\}forum/t-76692.\{200\}' /tmp/cs.html | head -2
          curl -sS -o /tmp/th.html -D - "https://scp-wiki.wikidot.com/forum/t-76692/scp-173" | grep -iE "^HTTP"
          echo "thread posts: $(grep -c 'id="post-' /tmp/th.html)"
